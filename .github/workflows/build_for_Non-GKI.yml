name: XiZi Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: '内核名称 (对应原 NAME)'
        required: true
        type: string
        default: 'XiZiKernel'
      kernel_version:
        description: '版本号 (对应原 VER)'
        required: true
        type: string
        default: 'v1.0'
      codename:
        description: '设备代号 (Codename，如 dipper)'
        required: true
        type: string
        default: 'dipper'
      is_ab_device:
        description: '是否为 A/B 分区双设备'
        required: true
        type: boolean
        default: false
      ak3_banner_text:
        description: 'TWRP 刷入时展示的内核欢迎文本'
        required: true
        type: string
        default: 'XiZi Custom Kernel - Powered by GitHub Actions'
      defconfig:
        description: '默认配置文件 (DEFCONFIG)'
        required: true
        type: string
        default: 'vendor/xiaomi/mi845_defconfig'
      device_config:
        description: '设备附加配置文件 (DEVICE_CONFIG，留空请保持为none)'
        required: false
        type: string
        default: 'vendor/xiaomi/dipper.config'
      disable_lto:
        description: '是否关闭 LTO 优化 (大幅加快 vmlinux.o 链接速度)'
        required: true
        type: boolean
        default: true
      fix_uts:
        description: '是否自动修复 UTS_LEN 64字符超限问题'
        required: true
        type: boolean
        default: true
      clang_version:
        description: 'Clang 版本号 (sdm845 4.9 内核推荐 r416183b 即 Clang 12)'
        required: true
        type: string
        default: 'r416183b'
      gcc_version:
        description: 'GCC 版本号 (Google AOSP 官方版本，如 4.9)'
        required: true
        type: string
        default: '4.9'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          path: kernel_workspace

      - name: 安装编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf \
            liblz4-tool libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 libssl-dev cpio libelf-dev file unzip tar xz-utils zstd

      - name: 拉取编译工具链 (Google AOSP 原生归档探测与拉取)
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # ==========================================================
          # 通用自适应解压函数
          # ==========================================================
          extract_archive() {
            local file_path="$1"
            local target_dir="$2"
            mkdir -p "$target_dir"
            
            local file_type
            file_type=$(file -b "$file_path" || true)
            echo "-> 识别文件格式: $file_type"
            
            case "$file_type" in
              *gzip*|*compress\'d*|*gzip\ compressed*)
                tar -xzf "$file_path" -C "$target_dir"
                ;;
              *XZ*|*xz*|*XZ\ compressed*)
                tar -xJf "$file_path" -C "$target_dir"
                ;;
              *Zip*|*zip*|*Zip\ archive*)
                unzip -q -o "$file_path" -d "$target_dir"
                ;;
              *bzip2*|*bzip*|*bzip2\ compressed*)
                tar -xjf "$file_path" -C "$target_dir"
                ;;
              *Zstandard*|*zstd*|*Zstandard\ compressed*)
                tar --zstd -xf "$file_path" -C "$target_dir"
                ;;
              *tar*|*POSIX\ tar*)
                tar -xf "$file_path" -C "$target_dir"
                ;;
              *)
                tar -xf "$file_path" -C "$target_dir" 2>/dev/null || \
                unzip -q -o "$file_path" -d "$target_dir" 2>/dev/null || return 1
                ;;
            esac
            return 0
          }

          # ==========================================================
          # 1. 智能探测拉取 Google AOSP 官方 Clang
          # ==========================================================
          CLANG_VER="${{ inputs.clang_version }}"
          mkdir -p clang
          echo "正在探测 Google AOSP 官方 Clang (目标: clang-${CLANG_VER})..."
          
          clang_branches=(
              "master-kernel-build-2021"
              "master-kernel-build-2022"
              "android12-release"
              "android13-release"
              "android14-release"
              "master-kernel-build-2023"
              "master-kernel-build-2024"
              "main"
              "master"
          )
          
          for br in "${clang_branches[@]}"; do
              test_url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${br}/clang-${CLANG_VER}.tar.gz"
              echo -ne "  -> 探测 Clang 分支 [${br}] ... "
              
              http_status=$(curl -s -o /dev/null -w "%{http_code}" -I "$test_url" || true)
              if [ "$http_status" == "200" ]; then
                  echo "命中！正在下载..."
                  curl -L -s -A "Mozilla/5.0" -o clang_dl.tmp "$test_url" || true
                  if [ -s clang_dl.tmp ] && extract_archive "clang_dl.tmp" "clang"; then
                      rm -f clang_dl.tmp
                      break
                  fi
                  rm -f clang_dl.tmp
              else
                  echo "跳过 (HTTP $http_status)"
              fi
          done

          # 自动扁平化目录层级
          if [ ! -f "clang/bin/clang" ]; then
              NESTED_BIN=$(find clang -type f -name "clang" | head -n 1)
              if [ -n "$NESTED_BIN" ]; then
                  NESTED_ROOT=$(dirname "$(dirname "$NESTED_BIN")")
                  cp -rn "$NESTED_ROOT"/* clang/ 2>/dev/null || true
              fi
          fi

          if [ ! -f "clang/bin/clang" ]; then
              echo "错误: Google 官方 Clang 拉取失败，未找到 clang/bin/clang！"
              exit 1
          fi
          echo "Clang 部署完成: $(./clang/bin/clang --version | head -n 1)"

          # ==========================================================
          # 2. 智能探测拉取 Google AOSP 官方 GCC 64 & GCC 32
          # ==========================================================
          GCC_VER="${{ inputs.gcc_version }}"
          mkdir -p gcc64 gcc32
          echo "正在探测 Google AOSP 官方 GCC (版本: ${GCC_VER})..."

          gcc_branches=(
              "android-10.0.0_r47"
              "android-9.0.0_r61"
              "android10-release"
              "pie-release"
              "master-kernel-build-2020"
              "master-kernel-build-2021"
              "android-8.1.0_r81"
              "main"
          )

          # 下载 GCC 64
          for br in "${gcc_branches[@]}"; do
              gcc64_url="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-${GCC_VER}/+archive/refs/heads/${br}.tar.gz"
              echo -ne "  -> 探测 GCC 64 分支 [${br}] ... "
              
              http_status=$(curl -s -o /dev/null -w "%{http_code}" -I "$gcc64_url" || true)
              if [ "$http_status" == "200" ]; then
                  echo "命中！正在下载..."
                  curl -L -s -A "Mozilla/5.0" -o gcc64_dl.tmp "$gcc64_url" || true
                  if [ -s gcc64_dl.tmp ] && extract_archive "gcc64_dl.tmp" "gcc64"; then
                      rm -f gcc64_dl.tmp
                      break
                  fi
                  rm -f gcc64_dl.tmp
              else
                  echo "跳过 (HTTP $http_status)"
              fi
          done

          # 下载 GCC 32
          for br in "${gcc_branches[@]}"; do
              gcc32_url="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-${GCC_VER}/+archive/refs/heads/${br}.tar.gz"
              echo -ne "  -> 探测 GCC 32 分支 [${br}] ... "
              
              http_status=$(curl -s -o /dev/null -w "%{http_code}" -I "$gcc32_url" || true)
              if [ "$http_status" == "200" ]; then
                  echo "命中！正在下载..."
                  curl -L -s -A "Mozilla/5.0" -o gcc32_dl.tmp "$gcc32_url" || true
                  if [ -s gcc32_dl.tmp ] && extract_archive "gcc32_dl.tmp" "gcc32"; then
                      rm -f gcc32_dl.tmp
                      break
                  fi
                  rm -f gcc32_dl.tmp
              else
                  echo "跳过 (HTTP $http_status)"
              fi
          done

          # 自动修正 GCC 目录层级
          if [ ! -f "gcc64/bin/aarch64-linux-android-gcc" ]; then
              NESTED_GCC64=$(find gcc64 -type f -name "aarch64-linux-android-gcc" | head -n 1)
              if [ -n "$NESTED_GCC64" ]; then
                  cp -rn "$(dirname "$(dirname "$NESTED_GCC64")")"/* gcc64/ 2>/dev/null || true
              fi
          fi
          if [ ! -f "gcc32/bin/arm-linux-androideabi-gcc" ]; then
              NESTED_GCC32=$(find gcc32 -type f -name "arm-linux-androideabi-gcc" | head -n 1)
              if [ -n "$NESTED_GCC32" ]; then
                  cp -rn "$(dirname "$(dirname "$NESTED_GCC32")")"/* gcc32/ 2>/dev/null || true
              fi
          fi

          # 验证 GCC 工具链完整性
          if [ ! -f "gcc64/bin/aarch64-linux-android-gcc" ] || [ ! -f "gcc32/bin/arm-linux-androideabi-gcc" ]; then
              echo "错误: Google 官方 GCC 工具链拉取失败，请检查 GCC 版本号是否正确！"
              exit 1
          fi
          echo "Google AOSP GCC 64 & GCC 32 部署成功！"

      - name: 开始编译内核
        run: |
          cd kernel_workspace
          export WORKSPACE_DIR=$(pwd)
          export OUT_DIR="${WORKSPACE_DIR}/Result"
          
          export CLANG_PATH="${GITHUB_WORKSPACE}/toolchains/clang"
          export GCC64_PATH="${GITHUB_WORKSPACE}/toolchains/gcc64"
          export GCC32_PATH="${GITHUB_WORKSPACE}/toolchains/gcc32"
          
          # 校验所有必要工具链
          for f in "$CLANG_PATH/bin/clang" "$GCC64_PATH/bin/aarch64-linux-android-gcc" "$GCC32_PATH/bin/arm-linux-androideabi-gcc"; do
            [ -e "$f" ] || { echo "工具链缺失: $f"; exit 1; }
          done
          
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$CLANG_PATH/lib64:$CLANG_PATH/lib:$LD_LIBRARY_PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          
          NAME="${{ inputs.kernel_name }}"
          VER="${{ inputs.kernel_version }}"
          DISABLE_LTO="${{ inputs.disable_lto }}"
          FIX_UTS="${{ inputs.fix_uts }}"
          DEFCONFIG="${{ inputs.defconfig }}"
          DEVICE_CONFIG="${{ inputs.device_config }}"
          
          BRANCH=$(git branch --show-current || echo "HEAD")
          KVER=$(make kernelversion || echo "Unknown")
          
          echo "Git分支 : $BRANCH"
          echo "内核版本: $KVER"
          
          DATE=$(date +%Y%m%d)
          LOCAL="-${NAME}-${VER}-${DATE}"
          
          # 移除引起 MTK 驱动报错的 make mrproper
          rm -rf "$OUT_DIR"
          
          echo "生成配置..."
          if [ -n "$DEVICE_CONFIG" ] && [ "$DEVICE_CONFIG" != "none" ]; then
            make O="$OUT_DIR" "$DEFCONFIG" "$DEVICE_CONFIG"
          else
            make O="$OUT_DIR" "$DEFCONFIG"
          fi
          
          sed -i '/^CONFIG_LOCALVERSION=/d' "$OUT_DIR/.config"
          echo "CONFIG_LOCALVERSION=\"$LOCAL\"" >> "$OUT_DIR/.config"
          
          if [ "$DISABLE_LTO" == "true" ]; then
            echo "-> 正在禁用 LTO 优化..."
            sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/' "$OUT_DIR/.config"
            sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' "$OUT_DIR/.config"
            sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/' "$OUT_DIR/.config"
            sed -i 's/CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/' "$OUT_DIR/.config"
            sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/' "$OUT_DIR/.config"
            echo "CONFIG_LTO_NONE=y" >> "$OUT_DIR/.config"
          fi
          
          make O="$OUT_DIR" olddefconfig >/dev/null 2>&1
          
          CURRENT_RELEASE=$(make O="$OUT_DIR" -s kernelrelease 2>/dev/null || true)
          RELEASE_LEN=${#CURRENT_RELEASE}
          
          if [ "$RELEASE_LEN" -gt 64 ] && [ "$FIX_UTS" == "true" ]; then
            echo "-> 尝试禁用 CONFIG_LOCALVERSION_AUTO..."
            sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' "$OUT_DIR/.config"
            CURRENT_RELEASE=$(make O="$OUT_DIR" -s kernelrelease 2>/dev/null || true)
            RELEASE_LEN=${#CURRENT_RELEASE}
            
            if [ "$RELEASE_LEN" -gt 64 ]; then
              echo "-> 正在截断名称..."
              EXCESS=$(( RELEASE_LEN - 64 ))
              NEW_LOCAL_LEN=$(( ${#LOCAL} - EXCESS ))
              NEW_LOCAL=${LOCAL:0:$NEW_LOCAL_LEN}
              
              sed -i '/^CONFIG_LOCALVERSION=/d' "$OUT_DIR/.config"
              echo "CONFIG_LOCALVERSION=\"$NEW_LOCAL\"" >> "$OUT_DIR/.config"
              make O="$OUT_DIR" olddefconfig >/dev/null 2>&1
              CURRENT_RELEASE=$(make O="$OUT_DIR" -s kernelrelease 2>/dev/null || true)
            fi
            echo "-> 修复成功！新的内核版本号为: $CURRENT_RELEASE (长度: ${#CURRENT_RELEASE})"
          fi
          
          echo "开始编译..."
          make -j"$(nproc --all)" O="$OUT_DIR" CC=clang Image.gz-dtb 2>&1 | tee build.log
          
          mkdir -p ${WORKSPACE_DIR}/artifacts
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ${WORKSPACE_DIR}/artifacts/
            echo "编译成功！"
          else
            echo "编译失败，未找到 Image.gz-dtb"
            exit 1
          fi
          cp build.log ${WORKSPACE_DIR}/artifacts/

      - name: 打包 AnyKernel3 刷机包
        run: |
          cd kernel_workspace
          export WORKSPACE_DIR=$(pwd)
          export OUT_DIR="${WORKSPACE_DIR}/Result"
          
          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "错误: 未找到内核文件 Image.gz-dtb，无法打包！"
            exit 1
          fi
          
          echo "正在拉取 AnyKernel3 源码..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          
          echo "根据 Action 交互参数配置 anykernel.sh..."
          sed -i "s|kernel.string=.*|kernel.string=${{ inputs.ak3_banner_text }}|g" anykernel.sh
          sed -i "s|device.name1=.*|device.name1=${{ inputs.codename }}|g" anykernel.sh
          sed -i "s|device.name2=.*|device.name2=|g" anykernel.sh
          sed -i "s|device.name3=.*|device.name3=|g" anykernel.sh
          sed -i "s|device.name4=.*|device.name4=|g" anykernel.sh
          sed -i "s|device.name5=.*|device.name5=|g" anykernel.sh
          
          if [ "${{ inputs.is_ab_device }}" == "true" ]; then
            sed -i "s|is_slot_device=.*|is_slot_device=1;|g" anykernel.sh
          else
            sed -i "s|is_slot_device=.*|is_slot_device=0;|g" anykernel.sh
          fi
          
          echo "复制编译产物到 AK3 目录..."
          cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" .
          rm -rf .git README.md *placeholder
          
          echo "开始生成 ZIP 刷机包..."
          ZIP_NAME="AnyKernel3-${{ inputs.kernel_name }}-${{ inputs.codename }}-$(date +%Y%m%d).zip"
          zip -r9 "$ZIP_NAME" *
          
          cp "$ZIP_NAME" ${WORKSPACE_DIR}/artifacts/

      - name: 上传内核及 AK3 刷机包产物
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Release-${{ inputs.codename }}-${{ inputs.kernel_name }}-${{ inputs.kernel_version }}
          path: kernel_workspace/artifacts/*
