name: 🚀 Dipper Kernel - Hybrid Clang & GCC4.9 Build

on:
  workflow_dispatch:
    inputs:
      port_touch:
        description: '移植小米官方触控驱动 (xiaomi, fts, synaptics)'
        required: true
        type: boolean
        default: true
      port_power:
        description: '移植小米官方电源与快充驱动 (battery/charger)'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: 🔨 混合交叉编译整合内核
    runs-on: ubuntu-22.04

    steps:
      - name: 1️⃣ 拉取当前 LineageOS 内核源码
        uses: actions/checkout@v3

      - name: 2️⃣ 部署底层编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3

      - name: 3️⃣ 从微软/GitHub云端秒切拉取 Clang 与绝版 GCC 4.9
        run: |
          echo "🌐 正在配置编译工具链目录..."
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # 1. 拉取 Proton-Clang (微软 Azure/GitHub 骨干网拉取，速度极快)
          echo "📥 拉取 Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
          # 2. 拉取 LineageOS 官方封存的 GCC 4.9 (ARM64 与 ARM32)
          echo "📥 拉取 GCC 4.9 AArch64..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          
          echo "📥 拉取 GCC 4.9 ARM32..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: 4️⃣ 自动化代码整合: 拉取并注入小米官方驱动
        run: |
          echo "🔄 连接 MiCode 官方仓库..."
          git remote add micode https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
          git fetch micode dipper-q-oss --depth=1

          if [ "${{ github.event.inputs.port_touch }}" = "true" ]; then
            echo "📱 注入 MIUI 专有触控驱动..."
            git checkout FETCH_HEAD -- drivers/input/touchscreen/xiaomi/
            git checkout FETCH_HEAD -- drivers/input/touchscreen/fts/
            git checkout FETCH_HEAD -- drivers/input/touchscreen/synaptics_dsx/
            
            # 动态绑定到内核编译树
            echo "obj-y += xiaomi/" >> drivers/input/touchscreen/Makefile
            echo "obj-y += fts/" >> drivers/input/touchscreen/Makefile
            echo "obj-y += synaptics_dsx/" >> drivers/input/touchscreen/Makefile
          fi

          if [ "${{ github.event.inputs.port_power }}" = "true" ]; then
            echo "🔋 注入 MIUI 电源快充驱动..."
            git checkout FETCH_HEAD -- drivers/power/supply/qcom/battery.c
            git checkout FETCH_HEAD -- drivers/power/supply/qcom/smb1355-charger.c
            git checkout FETCH_HEAD -- drivers/power/supply/qcom/smb-lib.c
          fi

      - name: 5️⃣ 动态双端注入 LineageOS 编译配置
        run: |
          BASE_CONFIG="arch/arm64/configs/vendor/xiaomi/mi845_defconfig"
          DEVICE_CONFIG="arch/arm64/configs/vendor/xiaomi/dipper.config"
          
          inject_config() {
            if [ -f "$1" ]; then
              echo "CONFIG_XIAOMI_TOUCH=y" >> "$1"
              echo "CONFIG_TOUCHSCREEN_FTS=y" >> "$1"
              echo "CONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y" >> "$1"
              echo "✅ 已向 $1 成功注入 MIUI 宏开关"
            fi
          }
          
          inject_config "$BASE_CONFIG"
          inject_config "$DEVICE_CONFIG"

      - name: 6️⃣ 开始混合交叉编译 (Clang + GCC4.9)
        run: |
          # 暴露工具链路径 (极其重要：Clang在前，GCC4.9在后)
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc-arm64/bin:$GITHUB_WORKSPACE/toolchain/gcc-arm32/bin:$PATH"
          
          # 定义架构和编译器变量
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "🧹 清理工作区..."
          make O=out clean
          
          echo "⚙️ 合成最终 .config 配置文件..."
          # 这里必须用 CC=clang 告诉 Kbuild 我们前端用的是 Clang
          make O=out CC=clang vendor/xiaomi/mi845_defconfig vendor/xiaomi/dipper.config
          
          echo "🚀 启动多线程混合编译..."
          # 核心魔法：CC 指定 Clang 解析C代码，CROSS_COMPILE 指定 GCC4.9 负责链接与汇编
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: 7️⃣ 自动配置并打包防错版 AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          # 自动化排雷脚本
          sed -i 's/IS_SLOT_DEVICE=1/IS_SLOT_DEVICE=0/g' anykernel.sh
          sed -i 's/block=auto/block=\/dev\/block\/bootdevice\/by-name\/boot/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=dipper/g' anykernel.sh
          sed -i '/# init.rc/,$d' anykernel.sh
          echo 'write_boot;' >> anykernel.sh
          
          # 复制内核镜像打包
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 ../Dipper-HyperOS-Port-Kernel.zip *

      - name: 8️⃣ 提取最终内核刷机包
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: Dipper-MIUI-Port-SukiSU-Kernel
          path: Dipper-HyperOS-Port-Kernel.zip
